# Proyecto avanzado 1 - Display de 7 segmentos
# OBLIGATORIO: sustituir wokwi_id: 0 por el ID del proyecto donde guardes ESTE circuito.
# El 0 es un marcador, NO un ID valido para compilar.
project:
  wokwi_id: 476596017759297537
  title: "Decodificador de 3 bits a 7 segmentos"
  author: "Beltrame_Martinez"
  discord: ""
  description: "Decodificador de 3 bits que muestra 0 a 7 en un display de catodo comun"
  language: "Wokwi"
  # Se conserva 10000 de la configuracion anterior, siguiendo la consigna.
  # El circuito es combinacional: no utiliza el reloj.
  clock_hz: 10000
  tiles: "1x1"

# Conservar todos los pines; dejar vacios los que no se utilizan.
pinout:
  # Entradas
  ui[0]: "in_0"
  ui[1]: "in_1"
  ui[2]: "in_2"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Salidas
  uo[0]: "out_A"
  uo[1]: "out_B"
  uo[2]: "out_C"
  uo[3]: "out_D"
  uo[4]: "out_E"
  uo[5]: "out_F"
  uo[6]: "out_G"
  uo[7]: ""

  # Pines bidireccionales sin uso
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# No cambiar.
yaml_version: 6

